coord_output: true
mask_output: true
glyph_coord_output: true
glyph_mask_output: true
vertical: false
quality: [85, 95]  # Increased quality for better character rendering
visibility_check: true
midground: 0.15    # Reduced for cleaner text
midground_offset:
  percents: [[-0.3, 0.3], [-0.3, 0.3]]  # Reduced offset range
foreground_mask_pad: 3  # Reduced padding
corpus:
  weights: [1, 0]
  args:
    # length augmentable corpus - Urdu text
    - paths: [resources/corpus/urdu_tune.txt, resources/corpus/urdu_tune.txt]
      weights: [1, 1]
      min_length: 1  # Keep single word generation
      max_length: 15  # Reduced max length
      textcase: [normal]  # Use normal case for Urdu
      augmentation: 0.05  # Reduced augmentation
      augmentation_length: [1, 10]
    - paths: []
      weights: []
      min_length: 1
      max_length: 15
      textcase: [normal]
      augmentation: 0
      augmentation_charset: resources/charset/urdu_52.txt
font:
  paths: [resources/font_urdu/]
  weights: [2]
  size: [80, 100]  # Increased font size for better connectedness
  bold: 0.5  # Reduced boldness
texture:
  prob: 0.3  # Reduced texture probability
  args:
    paths: [resources/image/]
    weights: [1]
    alpha: [0, 0.3]  # Reduced alpha for subtler textures
    grayscale: 0.5  # Allow some grayscale textures
    crop: 1
colormap2:
  paths: [resources/colormap/colormap.txt]
  weights: [1]
  k: 2
  alpha: [1, 1]
  colorize: 1
color:
  gray: [0, 200]  # Avoid pure white to maintain contrast
  alpha: [1, 1]
  colorize: 1
shape:
  prob: 0.5  # Reduced probability of shape distortion
  args:
    weights: [1, 0]  # Removed second distortion for connected scripts
    args:
      # Very mild elastic distortion
      - alpha: [1, 5]  # Significantly reduced from [15, 30]
        sigma: [3, 6]  # Reduced from [4, 12]
      # Removed second distortion
layout:
  weights: [9, 1]  # Heavily favor flow layout for connected script
  args:
    # flow layout - critical for connected scripts
    - space: [-4, -1]  # Negative space to ensure characters connect
      line_align: [middle]
    # curve layout - minimal use
    - curve: [5, 10]  # Reduced curve
      space: [-4, -1]  # Negative space to ensure characters connect
      convex: 0.5
      upward: 0.5
style:
  prob: 0.1  # Reduced styling
  args:
    weights: [1, 1, 0]  # Removed extrusion which can break connections
    args:
      # text border - mild
      - size: [1, 3]  # Reduced from [1, 12]
        alpha: [0.7, 0.9]  # Reduced alpha
        grayscale: 0
      # text shadow - subtle
      - distance: [1, 3]  # Reduced from [1, 6]
        angle: [0, 360]
        alpha: [0.2, 0.4]  # Reduced from [0.3, 0.7]
        grayscale: 0
transform:
  prob: 0.3  # Significantly reduced transformation probability
  args:
    weights: [1, 1, 0, 0, 0, 0, 1]  # Only keep perspective x, y and rotation
    args:
      # perspective x - mild
      - percents: [[0.9, 1], [1, 1]]  # Reduced from [[0.5, 1], [1, 1]]
        aligns: [[0, 0], [0, 0]]
      # perspective y - mild
      - percents: [[1, 1], [0.9, 1]]  # Reduced from [[1, 1], [0.5, 1]]
        aligns: [[0, 0], [0, 0]]
      # trapezoidate x - removed
      - weights: [0, 0, 0, 0]
        percent: [0, 0]
        align: [0, 0]
      # trapezoidate y - removed
      - weights: [0, 0, 0, 0]
        percent: [0, 0]
        align: [0, 0]
      # skew x - removed
      - weights: [0, 0]
        angle: [0, 0]
        ccw: 0
      # skew y - removed
      - weights: [0, 0]
        angle: [0, 0]
        ccw: 0
      # rotate - very minimal
      - angle: [0, 1]  # Reduced from [0, 3]
        ccw: 0.5
pad:
  prob: 1
  args:
    pxs: [[5, 10], [5, 10], [5, 10], [5, 10]]  # More consistent padding
postprocess:
  args:
    # gaussian noise - reduced
    - prob: 0.3  # Reduced from 1
      args:
        scale: [1, 3]  # Reduced from [4, 8]
        per_channel: 0
    # gaussian blur - minimal
    - prob: 0.2  # Reduced from 0.9
      args:
        sigma: [0, 1]  # Reduced from [0, 2]
    # resample - removed
    - prob: 0
      args:
        size: [0, 0]
    # median blur - minimal
    - prob: 0.1  # Reduced from 1
      args:
        k: [1, 1]